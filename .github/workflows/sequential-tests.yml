name: Sequential isolated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          check-latest: false

      - name: Check repository secret hygiene
        run: python scripts/check_repository_secrets.py

      - name: Validate repository harness
        run: python scripts/check_harness.py

      - name: Generate repository facts
        run: python scripts/project_facts.py --output artifacts/project-facts.json

      - name: Run runtime health check
        run: python -m podium7 health

      - name: Build and install package end to end
        run: python scripts/check_package_installation.py

      - name: Run every test in isolation
        if: always()
        run: PYTHONPATH="$GITHUB_WORKSPACE" python scripts/run_tests_one_by_one.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podium7-validation-evidence
          path: |
            artifacts/test-report.json
            artifacts/project-facts.json
          if-no-files-found: error

  minimum-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Check repository secret hygiene
        run: python scripts/check_repository_secrets.py

      - name: Validate repository harness
        run: python scripts/check_harness.py

      - name: Run runtime health check
        run: python -m podium7 health

      - name: Run every test in isolation on Python 3.11
        run: PYTHONPATH="$GITHUB_WORKSPACE" python scripts/run_tests_one_by_one.py
