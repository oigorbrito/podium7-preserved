name: Sequential isolated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          check-latest: false

      - name: Run runtime health check
        run: python -m podium7 health

      - name: Run every test in isolation
        run: python scripts/run_tests_one_by_one.py

      - name: Upload sequential test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podium7-sequential-test-report
          path: artifacts/test-report.json
          if-no-files-found: error
