name: Sequential isolated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          check-latest: false

      - name: Validate repository harness
        run: python scripts/check_harness.py

      - name: Generate repository facts
        run: python scripts/project_facts.py --output artifacts/project-facts.json

      - name: Run runtime health check
        run: python -m podium7 health

      - name: Run every test in isolation
        if: always()
        run: PYTHONPATH="$GITHUB_WORKSPACE" python scripts/run_tests_one_by_one.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podium7-validation-evidence
          path: |
            artifacts/test-report.json
            artifacts/project-facts.json
          if-no-files-found: error
